name: Deploy Frontend to Oracle VM

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Criar arquivo .env de producao para o build
        run: |
          cat > .env << 'EOF'
          APP_NAME="ConquistaServ"
          VERSION=1.0.0
          PORT=8080
          PROTOCOL=https
          BASE_URL=https://conquistaserv.brainstormlabs.online/
          API_BASE_URL=https://conquistaserv.brainstormlabs.online/api/
          EOF

      - name: Instalar Quasar CLI globalmente
        run: npm install -g @quasar/cli

      - name: Install Dependencies and Build (Native AMD64)
        run: |
          npm install
          NODE_OPTIONS=--max-old-space-size=4096 quasar build

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU para ARM64
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=main
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Deploy to Oracle VM via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            mkdir -p /srv/stacks/conquistaserv
            cd /srv/stacks/conquistaserv
            
            echo 'name: conquistaserv
            services:
              backend:
                image: ghcr.io/blimabru/conquistaserv-backend:main
                container_name: conquistaserv_backend
                restart: unless-stopped
                volumes:
                  - /etc/localtime:/etc/localtime:ro
                  - /etc/timezone:/etc/timezone:ro
                environment:
                  - TZ=America/Bahia
                  - NODE_ENV=production
                  - DATABASE_URL=${DATABASE_URL}
                  - ACCESS_TOKEN_SECRET=${ACCESS_TOKEN_SECRET}
                  - ACCESS_TOKEN_EXPIRATION=86400s
                  - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
                  - REFRESH_TOKEN_EXPIRATION=604800s
                  - HTTP_PORT=3006
                  - APP_HOSTNAME=conquistaserv.brainstormlabs.online
                  - APP_NAME=conquistaserv-backend
                networks:
                  - global-network
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

              frontend:
                image: ghcr.io/blimabru/conquistaserv-frontend:main
                container_name: conquistaserv_frontend
                restart: unless-stopped
                volumes:
                  - /etc/localtime:/etc/localtime:ro
                  - /etc/timezone:/etc/timezone:ro
                environment:
                  - TZ=America/Bahia
                networks:
                  - global-network
                logging:
                  driver: "json-file"
                  options:
                    max-size: "10m"
                    max-file: "3"

            networks:
              global-network:
                external: true' | sed 's/^            //' > docker-compose.yml
            
            docker compose pull frontend
            docker compose up -d frontend
            docker image prune -af