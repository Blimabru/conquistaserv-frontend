server {
    # O Nginx vai escutar requisições na porta 80
    listen 80;
    server_name localhost;

    # Pasta onde os arquivos do frontend compilado estão armazenados
    root /usr/share/nginx/html;
    
    # Arquivo principal que o Nginx tentará carregar
    index index.html;

    # ==========================================================================
    # REGRA DE ROTEAMENTO PARA SINGLE PAGE APPLICATIONS (SPA)
    # ==========================================================================
    # Quando o usuário acessa uma URL como "seudominio.com/dashboard", o servidor web 
    # normalmente procura por uma pasta chamada "dashboard". 
    # Como usamos Vue/Quasar (SPA), as rotas são virtuais e geridas pelo Javascript.
    # Esta regra diz: "Tente achar o arquivo. Se não achar, não dê Erro 404. Em vez disso, 
    # carregue o index.html e deixe que o Vue interprete qual tela deve aparecer".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==========================================================================
    # OTIMIZAÇÃO: CACHE DE ARQUIVOS ESTÁTICOS
    # ==========================================================================
    # Para imagens, CSS e Javascript, instruímos o navegador do usuário a guardar
    # esses arquivos na memória (cache) por 30 dias. 
    # Isso faz o site carregar muito mais rápido nos acessos seguintes e poupa banda.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # ==========================================================================
    # TRATAMENTO DE ERROS DO SERVIDOR
    # ==========================================================================
    # Se o servidor Nginx encontrar uma falha interna (Erro 500, etc), ele exibirá
    # uma página padrão amigável (50x.html).
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
